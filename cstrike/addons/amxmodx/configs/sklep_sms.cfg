// ----------------------------------
// SKLEP SMS: - Plik Konfiguracyjny
// ----------------------------------

// Wlacza / Wylacza sklepik
// 1 - wlaczony
// 0 - wylaczony
sklepsms_on "1"

// Komenda, ktora nalezy wpisac na chacie w celu wyswietlenia menu sklepiku
sklepsms_sklep_komenda "/sklepsms"

// Komenda, ktora nalezy wpisac na chacie w celu przeladowania flag wykupionych w sklepiku
sklepsms_przeladuj_komenda "/przeladuj"

// Wyswietlac informacje o sklepie na chacie?
sklepsms_info "1"


// #########################
// ###  Dane Bazy MySQL  ###
// #########################

// Adres IP
sklepsms_host ""

// Uzytkownik
sklepsms_user ""

// Haslo
sklepsms_pass ""

// Nazwa bazy danych
sklepsms_db ""
