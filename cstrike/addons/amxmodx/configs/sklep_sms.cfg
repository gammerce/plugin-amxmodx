// ----------------------------------
// SKLEP SMS: - Plik Konfiguracyjny
// ----------------------------------

// Wlacza / Wylacza sklep
// 1 - wlaczony
// 0 - wylaczony
sklepsms_on "1"

// Lista komend oddzielonych przecinkiem, ktore mozna wpisac na chacie, w celu wyswietlenia menu sklepie
sklepsms_sklep_komenda "/sklepsms,/shopsms"

// Lista komend oddzielonych przecinkiem, ktore mozna wpisac na chacie, w celu przeladowania flag wykupionych w sklepie
sklepsms_przeladuj_komenda "/przeladuj"

// Lista komend oddzielonych przecinkiem, ktore mozna wpisac na chacie, aby zobaczyc swoje aktywne uslugi
sklepsms_uslugi_komenda "/uslugi"

// Czy po uzyciu powyzszych komend wyswietla sie one w chacie
sklepsms_ciche_komendy "0"

// Wyswietlac informacje o sklepie na chacie?
sklepsms_info "1"


// #####################
// ###  Dane Sklepu  ###
// #####################

// Adres URL
sklepsms_url ""

// Token
sklepsms_token ""
